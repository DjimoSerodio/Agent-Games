<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Observatory - Coordination Olympiad</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #06060e;
    --panel: #0c0c16;
    --panel-alt: #10101c;
    --border: #191930;
    --border-glow: #252548;
    --accent: #8b7cf8;
    --accent2: #00f0d6;
    --danger: #ff4757;
    --warn: #ffbe3d;
    --success: #34e089;
    --text: #e8ecf4;
    --text-dim: #555e72;
    --text-mid: #8892a4;
    --private: #ff7675;
    --public: #74b9ff;
    --grain: #ffcc44;
    --timber: #3de88a;
    --ore: #b4a8ff;
    --energy: #00f0d6;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 13px;
    overflow: hidden;
    height: 100vh;
  }

  /* Header */
  #header {
    background: linear-gradient(180deg, #0e0e1c 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 48px;
  }
  #header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .header-center { display: flex; align-items: center; gap: 16px; }
  .header-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .header-pill.round { background: rgba(139,124,248,0.12); border: 1px solid rgba(139,124,248,0.25); color: var(--accent); }
  .header-pill.phase { background: rgba(0,240,214,0.08); border: 1px solid rgba(0,240,214,0.2); color: var(--accent2); text-transform: uppercase; }
  .header-pill.pool { background: rgba(255,190,61,0.08); border: 1px solid rgba(255,190,61,0.2); color: var(--warn); }
  #header .status { display: flex; align-items: center; gap: 12px; }
  .ws-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .ws-indicator .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .dot.disconnected { background: var(--danger); }
  #btn-run {
    background: linear-gradient(135deg, var(--accent) 0%, #6a5ad4 100%);
    border: none; color: white; padding: 6px 18px; border-radius: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    cursor: pointer; letter-spacing: 1.5px; transition: all 0.2s; text-transform: uppercase;
  }
  #btn-run:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(139,124,248,0.35); }
  #btn-run:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Main Grid */
  #main {
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 1fr 1fr;
    height: calc(100vh - 48px);
    gap: 1px;
    background: var(--border);
  }

  /* Panels */
  .panel { background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header {
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0; background: var(--panel-alt);
  }
  .panel-body { flex: 1; overflow-y: auto; padding: 6px 10px; }
  .panel-body::-webkit-scrollbar { width: 3px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

  /* Game View */
  #game-view { grid-row: 1; grid-column: 1; position: relative; }
  #hex-canvas { width: 100%; height: 100%; display: block; }
  #crisis-bar {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10; pointer-events: none; transition: opacity 0.6s ease; opacity: 0;
  }
  #crisis-bar.visible { opacity: 1; }
  #crisis-bar .crisis-inner {
    background: rgba(255,71,87,0.15); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,71,87,0.5); border-radius: 10px;
    padding: 10px 24px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 30px rgba(255,71,87,0.2);
  }
  #crisis-bar .crisis-icon {
    font-size: 18px; width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,71,87,0.25); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #crisis-bar .crisis-text h4 { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--danger); letter-spacing: 1px; text-transform: uppercase; }
  #crisis-bar .crisis-text p { font-size: 11px; color: var(--text-mid); margin-top: 2px; max-width: 400px; }

  /* Comms Feed */
  #comms-feed { grid-row: 2; grid-column: 1; }
  .msg { padding: 4px 0; border-bottom: 1px solid rgba(25,25,48,0.4); animation: fadeIn 0.25s ease; display: flex; gap: 6px; align-items: baseline; font-size: 11px; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }
  .msg-badge { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 3px; letter-spacing: 0.8px; flex-shrink: 0; }
  .msg-badge.public { background: rgba(116,185,255,0.12); color: var(--public); }
  .msg-badge.private { background: rgba(255,118,117,0.12); color: var(--private); }
  .msg-badge.system { background: rgba(255,190,61,0.12); color: var(--warn); }
  .msg-badge.crisis { background: rgba(255,71,87,0.15); color: var(--danger); }
  .msg-badge.trust { background: rgba(0,240,214,0.1); color: var(--accent2); }
  .msg-badge.action { background: rgba(139,124,248,0.1); color: var(--accent); }
  .msg-sender { color: var(--accent); font-weight: 600; font-size: 11px; white-space: nowrap; }
  .msg-arrow { color: var(--text-dim); font-size: 9px; }
  .msg-recipient { color: var(--private); font-weight: 600; font-size: 11px; white-space: nowrap; }
  .msg-content { color: var(--text-mid); font-size: 11px; line-height: 1.4; }
  #prize-bar {
    padding: 6px 14px; border-top: 1px solid var(--border); display: flex;
    justify-content: space-between; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; flex-shrink: 0; background: var(--panel-alt);
  }
  #prize-bar .label { color: var(--text-dim); letter-spacing: 1px; }
  #prize-bar .value { color: var(--warn); font-weight: 700; }

  /* Scoreboard */
  #scoreboard { grid-row: 1; grid-column: 2; }
  .agent-card { background: rgba(16,16,28,0.7); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 5px; transition: all 0.3s; }
  .agent-card.leader { border-color: rgba(255,190,61,0.4); box-shadow: 0 0 14px rgba(255,190,61,0.08); }
  .agent-card .agent-row { display: flex; justify-content: space-between; align-items: center; }
  .agent-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; }
  .agent-vp { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800; color: var(--warn); line-height: 1; }
  .agent-vp-label { font-size: 8px; color: var(--text-dim); font-weight: 600; letter-spacing: 1px; }
  .agent-strategy { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); letter-spacing: 0.5px; margin-top: 1px; }
  .agent-bonus { font-family: 'JetBrains Mono', monospace; font-size: 7px; font-weight: 700; padding: 1px 4px; border-radius: 3px; margin-left: 3px; }
  .bonus-road { background: rgba(255,190,61,0.15); color: var(--warn); }
  .bonus-influence { background: rgba(0,240,214,0.12); color: var(--accent2); }
  .agent-resources { display: flex; gap: 3px; margin-top: 5px; }
  .res-chip { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 3px; }
  .res-chip .res-dot { width: 5px; height: 5px; border-radius: 50%; }
  .res-chip.grain { background: rgba(255,204,68,0.1); color: var(--grain); }
  .res-chip.grain .res-dot { background: var(--grain); }
  .res-chip.timber { background: rgba(61,232,138,0.1); color: var(--timber); }
  .res-chip.timber .res-dot { background: var(--timber); }
  .res-chip.ore { background: rgba(180,168,255,0.1); color: var(--ore); }
  .res-chip.ore .res-dot { background: var(--ore); }
  .res-chip.energy { background: rgba(0,240,214,0.08); color: var(--energy); }
  .res-chip.energy .res-dot { background: var(--energy); }
  .agent-bottom { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .trust-mini { flex: 1; display: flex; align-items: center; gap: 4px; }
  .trust-mini-label { font-size: 8px; color: var(--text-dim); }
  .trust-mini-bg { flex: 1; height: 3px; background: rgba(25,25,48,0.8); border-radius: 2px; overflow: hidden; }
  .trust-mini-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .trust-mini-val { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--accent2); width: 24px; text-align: right; }
  .influence-chip { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--accent2); padding: 1px 4px; border-radius: 3px; background: rgba(0,240,214,0.08); white-space: nowrap; }
  .struct-chips { display: flex; gap: 3px; margin-top: 3px; }
  .struct-chip { font-size: 8px; padding: 1px 4px; border-radius: 3px; font-weight: 600; background: rgba(139,124,248,0.1); color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  /* Trust Heatmap */
  #trust-panel { grid-row: 2; grid-column: 2; }
  #trust-heatmap { display: grid; gap: 2px; padding: 8px; }
  .heatmap-cell { width: 100%; aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; transition: background 0.5s; }
  .heatmap-label { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); text-align: center; padding: 2px; font-weight: 600; }

  /* Fullscreen */
  .btn-fullscreen {
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim); width: 24px; height: 24px; border-radius: 4px;
    cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .btn-fullscreen:hover { border-color: var(--accent); color: var(--accent); background: rgba(139,124,248,0.08); }
  #game-view.fullscreen { position: fixed !important; inset: 0 !important; z-index: 50 !important; grid-row: unset !important; grid-column: unset !important; }
  #game-view.fullscreen .panel-header { background: rgba(12,12,22,0.95); backdrop-filter: blur(8px); }

  .filter-group { display: flex; gap: 6px; font-size: 9px; font-family: 'JetBrains Mono', monospace; }
  .filter-group label { cursor: pointer; color: var(--text-dim); display: flex; align-items: center; gap: 3px; }
  .filter-group input { width: 11px; height: 11px; accent-color: var(--accent); }

  /* ============================================================
     Game Over / Post-Game Report
     ============================================================ */
  #game-over {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(4,4,10,0.94); backdrop-filter: blur(10px);
    overflow-y: auto;
  }
  #game-over.visible { display: block; }
  .report {
    max-width: 860px; margin: 0 auto; padding: 40px 24px 60px;
  }
  .report-header {
    text-align: center; margin-bottom: 36px;
  }
  .report-header h2 {
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800;
    background: linear-gradient(135deg, var(--warn), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 6px; margin-bottom: 6px;
  }
  .report-header .subtitle {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-dim); letter-spacing: 2px;
  }

  /* Winner podium */
  .podium {
    display: flex; justify-content: center; align-items: flex-end; gap: 12px;
    margin-bottom: 36px; padding: 0 20px;
  }
  .podium-slot {
    text-align: center; flex: 1; max-width: 180px;
  }
  .podium-bar {
    background: var(--panel-alt); border: 1px solid var(--border);
    border-radius: 10px 10px 0 0; padding: 16px 12px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    position: relative; overflow: hidden;
  }
  .podium-slot.first .podium-bar {
    border-color: rgba(255,190,61,0.4);
    background: linear-gradient(180deg, rgba(255,190,61,0.08) 0%, var(--panel-alt) 100%);
    box-shadow: 0 -8px 40px rgba(255,190,61,0.1);
  }
  .podium-rank {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    color: var(--text-dim); letter-spacing: 1px;
  }
  .podium-slot.first .podium-rank { color: var(--warn); }
  .podium-name {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  }
  .podium-vp {
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800;
    color: var(--warn); line-height: 1;
  }
  .podium-vp-label {
    font-size: 9px; color: var(--text-dim); letter-spacing: 1px; font-weight: 600;
  }
  .podium-strategy {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    color: var(--text-dim); letter-spacing: 0.5px; margin-top: 2px;
    padding: 2px 8px; border-radius: 4px; background: rgba(139,124,248,0.08);
  }
  .podium-pedestal {
    background: var(--panel-alt); border: 1px solid var(--border);
    border-top: none; border-radius: 0 0 8px 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-dim); padding: 4px 0; text-align: center;
  }
  .podium-slot.first .podium-pedestal { background: rgba(255,190,61,0.04); border-color: rgba(255,190,61,0.2); }

  /* Report sections */
  .report-section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 20px; overflow: hidden;
  }
  .report-section-header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);
    background: var(--panel-alt);
  }
  .report-section-body { padding: 16px 18px; }

  /* VP Chart */
  #vp-chart-canvas { width: 100%; height: 200px; display: block; border-radius: 6px; }

  /* Key Moments */
  .moment {
    display: flex; gap: 12px; align-items: flex-start; padding: 8px 0;
    border-bottom: 1px solid rgba(25,25,48,0.4);
  }
  .moment:last-child { border-bottom: none; }
  .moment-round {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
    color: var(--accent); background: rgba(139,124,248,0.1);
    padding: 2px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    min-width: 36px; text-align: center;
  }
  .moment-icon { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; }
  .moment-text { flex: 1; }
  .moment-title { font-weight: 600; font-size: 12px; color: var(--text); }
  .moment-desc { font-size: 11px; color: var(--text-mid); margin-top: 2px; }
  .moment.betrayal .moment-round { background: rgba(255,71,87,0.15); color: var(--danger); }
  .moment.crisis .moment-round { background: rgba(255,71,87,0.12); color: var(--danger); }
  .moment.cooperation .moment-round { background: rgba(0,240,214,0.1); color: var(--accent2); }
  .moment.build .moment-round { background: rgba(255,190,61,0.1); color: var(--warn); }

  /* Trust Evolution Chart */
  #trust-chart-canvas { width: 100%; height: 180px; display: block; border-radius: 6px; }

  /* MVP Awards */
  .awards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .award-card {
    background: rgba(16,16,28,0.6); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; text-align: center;
  }
  .award-icon { font-size: 24px; margin-bottom: 4px; }
  .award-title { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .award-winner { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
  .award-detail { font-size: 10px; color: var(--text-mid); margin-top: 2px; }

  /* Final Trust Matrix in report */
  .trust-grid { display: grid; gap: 3px; }
  .trust-grid-cell {
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    aspect-ratio: 1;
  }
  .trust-grid-label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim);
    text-align: center; font-weight: 600; display: flex; align-items: center; justify-content: center;
  }

  /* Close button */
  .report-close {
    display: block; margin: 24px auto 0; background: transparent;
    border: 1px solid rgba(139,124,248,0.3); color: var(--accent);
    padding: 10px 36px; border-radius: 8px; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .report-close:hover { background: rgba(139,124,248,0.08); border-color: var(--accent); }

  /* Game summary stats bar */
  .game-stats-bar {
    display: flex; justify-content: center; gap: 24px;
    margin-bottom: 28px; flex-wrap: wrap;
  }
  .stat-item {
    text-align: center;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800;
    color: var(--warn);
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 600;
    color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Nexus Observatory</h1>
  <div class="header-center">
    <span class="header-pill round" id="round-display">WAITING</span>
    <span class="header-pill phase" id="phase-display">--</span>
    <span class="header-pill pool" id="pool-display">0.000 ETH</span>
  </div>
  <div class="status">
    <span class="ws-indicator"><span class="dot disconnected" id="ws-dot"></span><span id="ws-status">...</span></span>
    <button id="btn-run">Run Game</button>
  </div>
</div>

<div id="main">
  <div class="panel" id="game-view">
    <div class="panel-header">
      <span>Game Map</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="wheel-display" style="color:var(--warn)"></span>
        <button class="btn-fullscreen" id="btn-fullscreen" title="Fullscreen (ESC to exit)">&#x26F6;</button>
      </div>
    </div>
    <div class="panel-body" style="position:relative; padding:0; overflow:hidden;">
      <canvas id="hex-canvas"></canvas>
      <div id="crisis-bar"><div class="crisis-inner"><div class="crisis-icon"></div><div class="crisis-text"><h4></h4><p></p></div></div></div>
    </div>
  </div>

  <div class="panel" id="comms-feed">
    <div class="panel-header">
      <span>Comms Intercept</span>
      <div class="filter-group">
        <label><input type="checkbox" id="show-public" checked>PUB</label>
        <label><input type="checkbox" id="show-private" checked>PVT</label>
        <label><input type="checkbox" id="show-system" checked>SYS</label>
      </div>
    </div>
    <div class="panel-body" id="comms-log"></div>
    <div id="prize-bar">
      <span class="label">PRIZE POOL</span>
      <span class="value" id="pool-value">0.000 ETH</span>
    </div>
  </div>

  <div class="panel" id="scoreboard">
    <div class="panel-header">Agents</div>
    <div class="panel-body" id="agents-list"></div>
  </div>

  <div class="panel" id="trust-panel">
    <div class="panel-header">Trust Matrix</div>
    <div class="panel-body" id="trust-body"></div>
  </div>
</div>

<!-- Game Over: Full Post-Game Report -->
<div id="game-over">
  <div class="report" id="report-content"></div>
</div>

<script>
// ============================================================
// State
// ============================================================
const state = {
  ws: null,
  connected: false,
  agents: {},
  agentOrder: [],
  round: 0,
  phase: '',
  crisis: null,
  prizePool: 0,
  payablePrizePool: 0,
  slashedPrizePool: 0,
  carryoverPrizePool: 0,
  commonsHealth: null,
  commitments: [],
  attestations: [],
  moveCount: 0,
  trustMatrix: { agents: [], matrix: [] },
  hexGrid: [],
  agentPositions: {},
  gameId: null,
  gameOver: false,
  wheelPosition: 0,
  productionNumber: 0,
  productionWheel: [],
  bonusHolders: { longestRoad: null, mostInfluence: null },
  structureOffsets: new Map(),
  // ---- HISTORY for post-game report ----
  history: {
    vpPerRound: {},       // { agentId: [vp_r1, vp_r2, ...] }
    trustPerRound: {},    // { agentId: [trust_r1, trust_r2, ...] }
    keyMoments: [],       // [{ round, type, icon, title, desc, agents }]
    trustUpdates: [],     // raw trust deltas for analysis
    crises: [],           // { round, name, resolved, contributors }
    trades: {},           // { agentId: count }
    betrayals: {},        // { agentId: count }
    builds: {},           // { agentId: count }
  }
};

const AGENT_COLORS = ['#8b7cf8','#00f0d6','#ffbe3d','#ff7675','#34e089','#b4a8ff'];
const AGENT_LETTERS = 'ABCDEFGH';

const TERRAIN = {
  plains:    { bg: '#5c4a0e', bg2: '#3d3008', stroke: '#c9a832', fill: 'rgba(255,210,80,0.35)', glow: '#ffe066', label: 'Grain', icon: '\u{1F33E}' },
  forest:    { bg: '#1a5428', bg2: '#0e3818', stroke: '#3aad56', fill: 'rgba(80,240,140,0.30)', glow: '#5cf09a', label: 'Timber', icon: '\u{1F332}' },
  mountains: { bg: '#352e6a', bg2: '#231e4a', stroke: '#7a70d0', fill: 'rgba(170,160,255,0.30)', glow: '#c0b8ff', label: 'Ore', icon: '\u26F0\uFE0F' },
  rivers:    { bg: '#0c4858', bg2: '#083040', stroke: '#22a8c0', fill: 'rgba(40,220,230,0.28)', glow: '#40e8f0', label: 'Energy', icon: '\u{1F30A}' },
  wasteland: { bg: '#1a1a20', bg2: '#121216', stroke: '#444450', fill: 'rgba(60,60,70,0.25)', glow: '#666', label: 'Waste', icon: '\u{1F480}' },
  nexus:     { bg: '#3a2890', bg2: '#261a68', stroke: '#8070e0', fill: 'rgba(150,130,255,0.35)', glow: '#a898ff', label: 'NEXUS', icon: '\u2B50' },
};

// ============================================================
// WebSocket
// ============================================================
function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  state.ws = ws;
  ws.onopen = () => {
    state.connected = true;
    document.getElementById('ws-dot').className = 'dot connected';
    document.getElementById('ws-status').textContent = 'Live';
  };
  ws.onclose = () => {
    state.connected = false;
    document.getElementById('ws-dot').className = 'dot disconnected';
    document.getElementById('ws-status').textContent = 'Off';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    try { handleMessage(JSON.parse(e.data)); } catch(err) { console.error(err); }
  };
}

// ============================================================
// Event Handling
// ============================================================
function handleMessage(msg) {
  if (msg.type === 'welcome') {
    if (msg.data.trustGraph) { state.trustMatrix = msg.data.trustGraph; renderTrustHeatmap(); }
    return;
  }
  if (msg.type === 'game_event') handleGameEvent(msg.event);
}

function handleGameEvent(ev) {
  const d = ev.data;
  switch(ev.type) {
    case 'game.started':
      state.gameId = ev.gameId;
      state.gameOver = false;
      state.prizePool = 0;
      state.payablePrizePool = 0;
      state.slashedPrizePool = 0;
      state.carryoverPrizePool = 0;
      state.commonsHealth = null;
      state.commitments = [];
      state.attestations = [];
      state.moveCount = 0;
      state.structureOffsets.clear();
      // Reset history
      state.history = { vpPerRound: {}, trustPerRound: {}, keyMoments: [], trustUpdates: [], crises: [], trades: {}, betrayals: {}, builds: {} };
      document.getElementById('game-over').classList.remove('visible');
      if (d.players) {
        state.agentOrder = d.players;
        d.players.forEach((id, i) => {
          state.agents[id] = {
            id, name: `Agent ${i+1}`, strategy: '?',
            vp: 1, influence: 0,
            resources: { grain: 2, timber: 2, ore: 1, energy: 0 },
            trust: 0, color: AGENT_COLORS[i % AGENT_COLORS.length],
            structures: { settlements: 1, cities: 0, beacons: 0, tradePosts: 0, roads: 0 },
            structureLocations: [],
          };
          state.history.vpPerRound[id] = [];
          state.history.trustPerRound[id] = [];
          state.history.trades[id] = 0;
          state.history.betrayals[id] = 0;
          state.history.builds[id] = 0;
        });
        renderAgents();
      }
      addSystemMsg('Game started');
      break;

    case 'game.agent_info':
      if (d.agents) {
        d.agents.forEach(info => {
          if (state.agents[info.id]) {
            state.agents[info.id].name = info.name;
            state.agents[info.id].strategy = info.strategy;
          }
        });
        renderAgents();
      }
      break;

    case 'game.map_data':
      state.hexGrid = d.hexes || [];
      state.agentPositions = d.agentPositions || {};
      state.productionWheel = d.productionWheel || [];
      break;

    case 'game.state_update':
      if (d.agentStates) {
        for (const [id, s] of Object.entries(d.agentStates)) {
          const a = state.agents[id];
          if (!a) continue;
          a.resources = s.resources;
          a.vp = s.vp;
          a.influence = s.influence;
          a.structures = s.structures;
          a.structureLocations = s.structureLocations || [];
          // Track VP history
          state.history.vpPerRound[id] = state.history.vpPerRound[id] || [];
          state.history.vpPerRound[id].push(s.vp);
        }
      }
      if (d.bonusHolders) state.bonusHolders = d.bonusHolders;
      if (d.moveCount !== undefined) {
        state.moveCount = d.moveCount;
      }
      if (d.prizePool !== undefined) {
        state.prizePool = Number(d.prizePool) / 1e18;
      }
      if (d.payablePrizePool !== undefined) {
        state.payablePrizePool = Number(d.payablePrizePool) / 1e18;
      }
      if (d.slashedPrizePool !== undefined) {
        state.slashedPrizePool = Number(d.slashedPrizePool) / 1e18;
      }
      if (d.carryoverPrizePool !== undefined) {
        state.carryoverPrizePool = Number(d.carryoverPrizePool) / 1e18;
      }
      if (d.commonsHealth) {
        state.commonsHealth = d.commonsHealth;
      }
      if (d.commitments) {
        state.commitments = d.commitments;
      }
      if (d.attestations) {
        state.attestations = d.attestations;
        updatePoolDisplay();
      }
      if (d.actionSummary) {
        d.actionSummary.forEach(s => {
          const a = state.agents[s.agentId];
          addCommMsg('action', a ? a.name : '?', null, `${s.description}`);
          // Track builds
          if (s.type && s.type.startsWith('build')) {
            state.history.builds[s.agentId] = (state.history.builds[s.agentId] || 0) + 1;
            if (s.type === 'build_city') {
              state.history.keyMoments.push({
                round: state.round, type: 'build', icon: '\u{1F3D7}',
                title: `${a?.name || '?'} built a City`,
                desc: s.description,
                agentColor: a?.color
              });
            }
          }
          if (s.type === 'trade_offer') {
            state.history.trades[s.agentId] = (state.history.trades[s.agentId] || 0) + 1;
          }
        });
      }
      renderAgents();
      break;

    case 'game.round.start':
      state.round = d.round;
      document.getElementById('round-display').textContent = `Round ${d.round}`;
      break;

    case 'game.phase.change':
      state.phase = d.phase;
      document.getElementById('phase-display').textContent = d.phase;
      break;

    case 'game.action':
      if (d.type === 'production') {
        state.wheelPosition = d.wheelPosition;
        state.productionNumber = d.productionNumber;
        document.getElementById('wheel-display').textContent = `\u2699 ${d.productionNumber}`;
      }
      break;

    case 'chat.public': {
      const m = d.message, a = state.agents[m.sender];
      addCommMsg('public', a ? a.name : '?', null, m.content);
      break;
    }
    case 'chat.private': {
      const m = d.message;
      const from = state.agents[m.sender], to = state.agents[m.recipient];
      addCommMsg('private', from ? from.name : '?', to ? to.name : '?', m.content);
      break;
    }

    case 'crisis.triggered':
      state.crisis = d.crisis;
      addSystemMsg(`CRISIS: ${d.crisis.name}`, 'crisis');
      showCrisis();
      state.history.keyMoments.push({
        round: state.round, type: 'crisis', icon: '\u26A0\uFE0F',
        title: `Crisis: ${d.crisis.name}`,
        desc: d.crisis.description || 'A crisis threatens the land!',
      });
      break;

    case 'crisis.resolved': {
      const resolved = d.resolved;
      if (resolved) {
        const names = (d.contributors||[]).map(c => state.agents[c]?.name || '?');
        addSystemMsg(`Crisis resolved! ${names.join(', ')}`, 'system');
        state.history.keyMoments.push({
          round: state.round, type: 'cooperation', icon: '\u2705',
          title: `Crisis Resolved!`,
          desc: `Contributors: ${names.join(', ')}`,
        });
        state.history.crises.push({ round: state.round, name: state.crisis?.name, resolved: true, contributors: d.contributors || [] });
      } else {
        addSystemMsg(`Crisis failed! ${d.penalty || ''}`, 'crisis');
        state.history.keyMoments.push({
          round: state.round, type: 'crisis', icon: '\u274C',
          title: `Crisis Failed!`,
          desc: d.penalty || 'The crisis was not resolved.',
        });
        state.history.crises.push({ round: state.round, name: state.crisis?.name, resolved: false, contributors: [] });
      }
      state.crisis = null;
      hideCrisis();
      break;
    }

    case 'trust.updated':
      if (d.updates) {
        d.updates.forEach(u => {
          const fn = state.agents[u.from]?.name || '?';
          const tn = state.agents[u.to]?.name || '?';
          addCommMsg('trust', fn, tn, `${u.delta > 0 ? '+' : ''}${u.delta.toFixed(2)} ${u.reason}`);
          state.history.trustUpdates.push({ ...u, round: state.round, fromName: fn, toName: tn });
          // Track betrayals
          if (u.reason === 'trade_not_reciprocated' || u.reason === 'sabotage_action') {
            state.history.betrayals[u.to] = (state.history.betrayals[u.to] || 0) + 1;
            if (u.delta <= -0.1) {
              state.history.keyMoments.push({
                round: state.round, type: 'betrayal', icon: '\u{1F5E1}',
                title: `${tn} betrayed ${fn}`,
                desc: `${u.reason.replace(/_/g,' ')} (${u.delta > 0 ? '+' : ''}${u.delta.toFixed(2)} trust)`,
                agentColor: state.agents[u.to]?.color,
              });
            }
          }
          if (u.reason === 'completed_trade') {
            state.history.trades[u.from] = (state.history.trades[u.from] || 0) + 1;
          }
        });
      }
      if (d.snapshots) {
        d.snapshots.forEach(s => {
          if (state.agents[s.agentId]) {
            state.agents[s.agentId].trust = s.globalScore;
            state.history.trustPerRound[s.agentId] = state.history.trustPerRound[s.agentId] || [];
            state.history.trustPerRound[s.agentId].push(s.globalScore);
          }
        });
        const ids = state.agentOrder;
        if (ids.length > 0) {
          state.trustMatrix.agents = ids;
          state.trustMatrix.matrix = ids.map(fId => {
            const snap = d.snapshots.find(s => s.agentId === fId);
            return ids.map(tId => fId === tId ? 0 : (snap?.directScores?.[tId] || 0));
          });
        }
        renderAgents();
        renderTrustHeatmap();
      }
      break;

    case 'commitment.detected':
      addSystemMsg(`Commitment detected: ${d.commitment?.id || '?'} ${d.commitment?.summary || ''}`, 'system');
      break;

    case 'commitment.attested':
      addSystemMsg(`Attestation: ${d.commitmentId || d.attestation?.commitmentId} ${d.attestation?.verdict || d.verdict || ''}`, 'trust');
      break;

    case 'commitment.resolved':
      addSystemMsg(`Commitment ${d.commitmentId} ${d.status}`, d.status === 'breached' ? 'crisis' : 'system');
      break;

    case 'prize.slashed':
      state.prizePool = Number(d.prizePoolWei) / 1e18;
      state.payablePrizePool = Number(d.payablePrizePoolWei) / 1e18;
      state.slashedPrizePool = Number(d.slashedPrizePoolWei) / 1e18;
      state.carryoverPrizePool = Number(d.carryoverPrizePoolWei) / 1e18;
      state.commonsHealth = d.commonsHealth;
      updatePoolDisplay();
      addSystemMsg(`Commons slash: ${state.slashedPrizePool.toFixed(3)} ETH rolls forward`, 'crisis');
      break;

    case 'game.ended':
      state.gameOver = true;
      document.getElementById('round-display').textContent = 'Game Over';
      document.getElementById('phase-display').textContent = '--';
      if (d.scores) {
        Object.entries(d.scores).forEach(([id, vp]) => { if (state.agents[id]) state.agents[id].vp = vp; });
        renderAgents();
      }
      showGameOver(d);
      break;
  }
}

function updatePoolDisplay() {
  const total = state.prizePool.toFixed(3) + ' ETH';
  const payable = state.payablePrizePool.toFixed(3) + ' ETH';
  document.getElementById('pool-value').textContent = total;
  document.getElementById('pool-display').textContent = `${total} / pay ${payable}`;
}

// ============================================================
// Crisis
// ============================================================
function showCrisis() {
  const bar = document.getElementById('crisis-bar');
  if (!state.crisis) return;
  const icons = { blight: '\u26A0', storm: '\u26A1', famine: '\u2620', nexus_surge: '\u269B', the_rift: '\u2604' };
  bar.querySelector('.crisis-icon').textContent = icons[state.crisis.type] || '\u26A0';
  bar.querySelector('h4').textContent = state.crisis.name;
  bar.querySelector('p').textContent = state.crisis.description;
  bar.classList.add('visible');
}
function hideCrisis() { document.getElementById('crisis-bar').classList.remove('visible'); }

// ============================================================
// Comms
// ============================================================
function addCommMsg(type, from, to, content) {
  const showPub = document.getElementById('show-public').checked;
  const showPvt = document.getElementById('show-private').checked;
  const showSys = document.getElementById('show-system').checked;
  if (type === 'public' && !showPub) return;
  if (type === 'private' && !showPvt) return;
  if (['system','crisis','trust','action'].includes(type) && !showSys) return;
  const log = document.getElementById('comms-log');
  const el = document.createElement('div');
  el.className = 'msg';
  const labels = { public:'PUB', private:'PVT', system:'SYS', crisis:'!!', trust:'TRS', action:'ACT' };
  let html = `<span class="msg-badge ${type}">${labels[type] || type}</span>`;
  html += `<span class="msg-sender">${esc(from)}</span>`;
  if (to && (type === 'private' || type === 'trust')) {
    html += `<span class="msg-arrow">\u2192</span><span class="msg-recipient">${esc(to)}</span>`;
  }
  html += `<span class="msg-content">${esc(content)}</span>`;
  el.innerHTML = html;
  log.appendChild(el);
  while (log.children.length > 300) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function addSystemMsg(t, type='system') { addCommMsg(type, 'SYS', null, t); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ============================================================
// Agents / Scoreboard
// ============================================================
function renderAgents() {
  const c = document.getElementById('agents-list');
  const sorted = [...state.agentOrder].sort((a,b) => (state.agents[b]?.vp||0) - (state.agents[a]?.vp||0));
  c.innerHTML = sorted.map((id, rank) => {
    const a = state.agents[id];
    if (!a) return '';
    const lead = rank === 0;
    const tp = Math.round((a.trust||0)*100);
    const st = a.structures || {};
    const pills = [];
    if (st.settlements>0) pills.push(`\u25B2${st.settlements}`);
    if (st.cities>0) pills.push(`\u2B22${st.cities}`);
    if (st.beacons>0) pills.push(`\u2726${st.beacons}`);
    if (st.tradePosts>0) pills.push(`\u25C6${st.tradePosts}`);
    if (st.roads>0) pills.push(`\u2501${st.roads}`);
    let bonus = '';
    if (state.bonusHolders.longestRoad === id) bonus += '<span class="agent-bonus bonus-road">ROAD</span>';
    if (state.bonusHolders.mostInfluence === id) bonus += '<span class="agent-bonus bonus-influence">INF</span>';
    return `
      <div class="agent-card ${lead?'leader':''}">
        <div class="agent-row">
          <div>
            <span class="agent-name" style="color:${a.color}">${esc(a.name)}</span>${bonus}
            <div class="agent-strategy">${a.strategy}</div>
          </div>
          <div style="text-align:right">
            <div class="agent-vp">${a.vp}</div>
            <div class="agent-vp-label">VP</div>
          </div>
        </div>
        <div class="agent-resources">
          <span class="res-chip grain"><span class="res-dot"></span>${a.resources?.grain??0}</span>
          <span class="res-chip timber"><span class="res-dot"></span>${a.resources?.timber??0}</span>
          <span class="res-chip ore"><span class="res-dot"></span>${a.resources?.ore??0}</span>
          <span class="res-chip energy"><span class="res-dot"></span>${a.resources?.energy??0}</span>
        </div>
        <div class="agent-bottom">
          <div class="trust-mini">
            <span class="trust-mini-label">T</span>
            <div class="trust-mini-bg"><div class="trust-mini-fill" style="width:${tp}%"></div></div>
            <span class="trust-mini-val">${(a.trust||0).toFixed(2)}</span>
          </div>
          <span class="influence-chip">\u2605 ${a.influence||0}</span>
        </div>
        ${pills.length ? `<div class="struct-chips">${pills.map(p=>`<span class="struct-chip">${p}</span>`).join('')}</div>` : ''}
      </div>`;
  }).join('');
}

// ============================================================
// Trust Heatmap (live sidebar)
// ============================================================
function renderTrustHeatmap() {
  const body = document.getElementById('trust-body');
  const { agents: ids, matrix } = state.trustMatrix;
  if (!ids?.length) { body.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:20px;font-size:11px;">Waiting for data...</p>'; return; }
  const n = ids.length;
  const names = ids.map(id => { const a = state.agents[id]; return a ? a.name.split('_')[0] : id.slice(0,4); });
  const g = document.createElement('div');
  g.id = 'trust-heatmap';
  g.style.gridTemplateColumns = `40px repeat(${n}, 1fr)`;
  g.style.gridTemplateRows = `20px repeat(${n}, 1fr)`;
  g.innerHTML = '<div></div>';
  names.forEach(nm => { g.innerHTML += `<div class="heatmap-label">${esc(nm)}</div>`; });
  for (let i = 0; i < n; i++) {
    g.innerHTML += `<div class="heatmap-label" style="text-align:right;padding-right:4px;">${esc(names[i])}</div>`;
    for (let j = 0; j < n; j++) {
      const v = matrix[i]?.[j] || 0;
      const bg = i===j ? 'rgba(20,20,30,0.5)' : trustCol(v);
      g.innerHTML += `<div class="heatmap-cell" style="background:${bg}">${i===j?'':v.toFixed(1)}</div>`;
    }
  }
  body.innerHTML = '';
  body.appendChild(g);
}
function trustCol(v) {
  if (v > 0) return `rgba(0,240,214,${Math.min(v,1)*0.55})`;
  if (v < 0) return `rgba(255,71,87,${Math.min(Math.abs(v),1)*0.55})`;
  return 'rgba(20,20,30,0.3)';
}

// ============================================================
// Hex Grid Canvas
// ============================================================
function h2px(q, r, cx, cy, sz) {
  return { x: cx + sz * (Math.sqrt(3)*q + Math.sqrt(3)/2*r), y: cy + sz * (1.5*r) };
}
function stableKey(type, q, r, agentIdx) { return `${type}:${q},${r}:${agentIdx}`; }
function getStableOffset(key, maxDist) {
  if (!state.structureOffsets.has(key)) {
    const angle = (hashStr(key) / 0xFFFF) * Math.PI * 2;
    const dist = ((hashStr(key + 'r') / 0xFFFF) * 0.5 + 0.5) * maxDist;
    state.structureOffsets.set(key, { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist });
  }
  return state.structureOffsets.get(key);
}
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return Math.abs(h); }

function drawHex(ctx, px, py, size) {
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const a = Math.PI / 3 * k - Math.PI / 6;
    const hx = px + size * Math.cos(a);
    const hy = py + size * Math.sin(a);
    k === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
  }
  ctx.closePath();
}

function renderHexGrid() {
  const canvas = document.getElementById('hex-canvas');
  const parent = canvas.parentElement;
  const W = parent.clientWidth, H = parent.clientHeight;
  if (W < 2 || H < 2) return;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== W*dpr || canvas.height !== H*dpr) {
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx = W / 2, cy = H / 2;
  const sz = Math.min(W, H) / 8;
  const inner = sz * 0.92;
  const now = Date.now();

  ctx.clearRect(0, 0, W, H);

  // Background - deep space with board glow
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.7);
  bgGrad.addColorStop(0, '#12122a');
  bgGrad.addColorStop(0.35, '#0a0a1c');
  bgGrad.addColorStop(1, '#040410');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Board glow - warm light behind the hex cluster
  const boardGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, sz * 4);
  boardGlow.addColorStop(0, 'rgba(100,80,200,0.06)');
  boardGlow.addColorStop(0.5, 'rgba(60,40,140,0.03)');
  boardGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = boardGlow;
  ctx.fillRect(0, 0, W, H);

  // Ambient particles (sparse floating dots)
  ctx.save();
  for (let pi = 0; pi < 30; pi++) {
    const seed = pi * 137.508;
    const px2 = (Math.sin(seed + now*0.0001) * 0.5 + 0.5) * W;
    const py2 = (Math.cos(seed * 1.3 + now*0.00008) * 0.5 + 0.5) * H;
    const alpha = 0.1 + 0.15 * Math.sin(now * 0.001 + pi);
    ctx.beginPath();
    ctx.arc(px2, py2, 1 + Math.sin(pi)*0.5, 0, Math.PI*2);
    ctx.fillStyle = pi % 3 === 0 ? 'rgba(139,124,248,' + alpha + ')' : pi % 3 === 1 ? 'rgba(0,240,214,' + alpha + ')' : 'rgba(255,190,61,' + alpha + ')';
    ctx.fill();
  }
  ctx.restore();

  const hexes = state.hexGrid.length > 0 ? state.hexGrid : fallbackHexes();
  const validHexKeys = new Set(hexes.map(h => `${h.q},${h.r}`));

  // ---- Roads ----
  ctx.save();
  for (const agentId of state.agentOrder) {
    const a = state.agents[agentId];
    if (!a?.structureLocations) continue;
    for (const s of a.structureLocations) {
      if (s.type !== 'road' || !s.hexes || s.hexes.length < 2) continue;
      if (!validHexKeys.has(`${s.hexes[0].q},${s.hexes[0].r}`) || !validHexKeys.has(`${s.hexes[1].q},${s.hexes[1].r}`)) continue;
      const p1 = h2px(s.hexes[0].q, s.hexes[0].r, cx, cy, sz);
      const p2 = h2px(s.hexes[1].q, s.hexes[1].r, cx, cy, sz);
      const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
      const dx = (p2.x-p1.x)*0.4, dy = (p2.y-p1.y)*0.4;
      // Glow underlay
      ctx.beginPath(); ctx.moveTo(mx-dx, my-dy); ctx.lineTo(mx+dx, my+dy);
      ctx.strokeStyle = a.color; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.12; ctx.stroke();
      // Main road
      ctx.beginPath(); ctx.moveTo(mx-dx, my-dy); ctx.lineTo(mx+dx, my+dy);
      ctx.strokeStyle = a.color; ctx.lineWidth = 4; ctx.globalAlpha = 0.8; ctx.stroke();
      // Center white highlight
      ctx.beginPath(); ctx.moveTo(mx-dx, my-dy); ctx.lineTo(mx+dx, my+dy);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.2; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.restore();

  // ---- Hex Tiles ----
  for (const hex of hexes) {
    const { x: px, y: py } = h2px(hex.q, hex.r, cx, cy, sz);
    const t = TERRAIN[hex.terrain] || TERRAIN.wasteland;
    const isProducing = hex.productionNumber === state.productionNumber && state.productionNumber > 0;

    // Drop shadow
    ctx.save();
    drawHex(ctx, px, py + 4, inner);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fill();
    ctx.restore();

    // Main hex - rich gradient from center-top to edge
    drawHex(ctx, px, py, inner);
    const hexGrad = ctx.createRadialGradient(px - inner*0.15, py - inner*0.35, inner*0.1, px, py, inner*1.05);
    hexGrad.addColorStop(0, lightenColor(t.bg, 40));
    hexGrad.addColorStop(0.45, t.bg);
    hexGrad.addColorStop(1, t.bg2 || t.bg);
    ctx.fillStyle = hexGrad;
    ctx.fill();

    // Bright inner glow - strong center bloom
    const glowGrad = ctx.createRadialGradient(px, py - inner*0.1, 0, px, py, inner * 0.75);
    glowGrad.addColorStop(0, t.fill);
    glowGrad.addColorStop(0.6, t.fill.replace(/[\d.]+\)$/, '0.12)'));
    glowGrad.addColorStop(1, 'transparent');
    drawHex(ctx, px, py, inner);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // Subtle texture pattern (diagonal lines for depth)
    ctx.save();
    drawHex(ctx, px, py, inner);
    ctx.clip();
    ctx.strokeStyle = t.stroke;
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.12;
    const step = sz * 0.18;
    for (let lx = px - inner*1.2; lx < px + inner*1.2; lx += step) {
      ctx.beginPath();
      ctx.moveTo(lx, py - inner*1.2);
      ctx.lineTo(lx + inner*0.6, py + inner*1.2);
      ctx.stroke();
    }
    ctx.restore();

    // Border - double stroke for richness
    drawHex(ctx, px, py, inner);
    ctx.strokeStyle = t.stroke;
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawHex(ctx, px, py, inner - 1.5);
    ctx.strokeStyle = t.glow;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.2;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Producing highlight - much more dramatic
    if (isProducing) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 250);
      // Strong outer glow
      ctx.save();
      drawHex(ctx, px, py, inner + 6);
      ctx.strokeStyle = t.glow;
      ctx.lineWidth = 4;
      ctx.shadowColor = t.glow;
      ctx.shadowBlur = 30 * pulse;
      ctx.globalAlpha = 0.7 + 0.3 * pulse;
      ctx.stroke();
      ctx.restore();
      // Bright wash overlay
      drawHex(ctx, px, py, inner);
      ctx.fillStyle = t.glow;
      ctx.globalAlpha = 0.08 + 0.06 * pulse;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Emoji icon - large and visible
    if (t.icon) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = hex.terrain === 'nexus' ? 0.6 : 0.4;
      ctx.font = `${sz * 0.32}px sans-serif`;
      ctx.fillText(t.icon, px, py - (hex.productionNumber > 0 ? sz * 0.12 : sz * 0.02));
      ctx.restore();
    }

    // Terrain label below icon
    if (t.label) {
      ctx.save();
      ctx.fillStyle = t.glow;
      ctx.globalAlpha = hex.terrain === 'nexus' ? 0.85 : 0.65;
      ctx.font = `800 ${sz * 0.12}px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labelY = py + (hex.productionNumber > 0 ? sz * 0.12 : sz * 0.2);
      ctx.fillText(t.label.toUpperCase(), px, labelY);
      ctx.restore();
    }

    // Production number - larger, bolder
    if (hex.productionNumber > 0 && hex.terrain !== 'wasteland') {
      const numY = py + inner * 0.52;
      // Circle bg
      ctx.beginPath();
      ctx.arc(px, numY, sz * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = isProducing ? 'rgba(255,200,50,0.45)' : 'rgba(0,0,0,0.6)';
      ctx.fill();
      ctx.strokeStyle = isProducing ? 'rgba(255,220,80,0.7)' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Number
      ctx.fillStyle = isProducing ? '#fff' : 'rgba(255,255,255,0.7)';
      ctx.font = `800 ${sz * 0.16}px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(hex.productionNumber.toString(), px, numY);
    }
  }

  // ---- Structures ----
  for (let ai = 0; ai < state.agentOrder.length; ai++) {
    const agentId = state.agentOrder[ai];
    const a = state.agents[agentId];
    if (!a?.structureLocations) continue;
    for (const s of a.structureLocations) {
      if (s.type === 'road' || !s.hexes?.length) continue;
      const h = s.hexes[0];
      if (!validHexKeys.has(`${h.q},${h.r}`)) continue;
      const { x: bx, y: by } = h2px(h.q, h.r, cx, cy, sz);
      const offKey = stableKey(s.type, h.q, h.r, ai);
      const off = getStableOffset(offKey, sz * 0.18);
      const ox = bx + off.x, oy = by + off.y - inner * 0.18;
      const r = sz * 0.2;

      ctx.save();
      ctx.shadowColor = a.color;
      ctx.shadowBlur = 14;

      // Draw shape path
      function drawStructShape() {
        ctx.beginPath();
        if (s.type === 'settlement') {
          ctx.moveTo(ox, oy - r*1.1); ctx.lineTo(ox - r, oy + r * 0.65); ctx.lineTo(ox + r, oy + r * 0.65); ctx.closePath();
        } else if (s.type === 'city') {
          for (let k = 0; k < 6; k++) { const ang = Math.PI*2/6*k - Math.PI/2; const sx2 = ox + r*1.15*Math.cos(ang); const sy2 = oy + r*1.15*Math.sin(ang); k===0?ctx.moveTo(sx2,sy2):ctx.lineTo(sx2,sy2); }
          ctx.closePath();
        } else if (s.type === 'beacon') {
          ctx.moveTo(ox, oy - r*1.3); ctx.lineTo(ox + r, oy); ctx.lineTo(ox, oy + r*1.3); ctx.lineTo(ox - r, oy); ctx.closePath();
        } else if (s.type === 'trade_post') {
          ctx.rect(ox - r*0.85, oy - r*0.85, r*1.7, r*1.7);
        }
      }

      // Fill
      drawStructShape();
      ctx.fillStyle = a.color; ctx.fill();

      // Bright white center highlight
      drawStructShape();
      const sGrad = ctx.createRadialGradient(ox, oy - r*0.2, 0, ox, oy, r);
      sGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
      sGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = sGrad; ctx.fill();

      // White border
      drawStructShape();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.6; ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.restore();
    }
  }

  // ---- Agent Home Markers ----
  state.agentOrder.forEach((id, i) => {
    const a = state.agents[id];
    const pos = state.agentPositions[id];
    if (!a || !pos) return;
    const { x: px, y: py } = h2px(pos.q, pos.r, cx, cy, sz);
    const r = sz * 0.22;

    // Large pulsing aura
    const pulse = 0.5 + 0.5 * Math.sin(now / 800 + i * 1.5);
    ctx.save();
    const auraGrad = ctx.createRadialGradient(px, py, r, px, py, r * 2.5);
    auraGrad.addColorStop(0, a.color.replace(')', ',0.2)').replace('rgb', 'rgba'));
    auraGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = auraGrad;
    ctx.globalAlpha = 0.3 + pulse * 0.2;
    ctx.beginPath(); ctx.arc(px, py, r * 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Pulsing ring
    ctx.beginPath(); ctx.arc(px, py, r + 3 + pulse * 4, 0, Math.PI * 2);
    ctx.strokeStyle = a.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.2 + pulse * 0.15;
    ctx.stroke(); ctx.globalAlpha = 1;

    // Main circle with glossy gradient
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
    const agGrad = ctx.createRadialGradient(px - r*0.3, py - r*0.4, r*0.1, px, py + r*0.2, r*1.1);
    agGrad.addColorStop(0, lightenColor(a.color, 60));
    agGrad.addColorStop(0.5, a.color);
    agGrad.addColorStop(1, lightenColor(a.color, -30));
    ctx.fillStyle = agGrad;
    ctx.shadowColor = a.color; ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Glossy highlight
    ctx.beginPath(); ctx.arc(px - r*0.15, py - r*0.2, r*0.55, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();

    // Border
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();

    // Letter
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${sz * 0.2}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4;
    ctx.fillText(AGENT_LETTERS[i] || '?', px, py + 1);
    ctx.shadowBlur = 0;

    // Name + VP badge below
    const badgeW = sz * 0.7, badgeH = sz * 0.2;
    const bx = px - badgeW/2, byy = py + r + 7;
    ctx.fillStyle = 'rgba(4,4,14,0.85)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, byy, badgeW, badgeH, 6);
    else ctx.rect(bx, byy, badgeW, badgeH);
    ctx.fill();
    ctx.strokeStyle = a.color; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;

    const shortName = (a.name || '?').split('_')[0];
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `600 ${sz * 0.09}px 'Inter', sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(shortName, bx + 7, byy + badgeH/2);
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${sz * 0.11}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'right';
    ctx.fillText(`${a.vp}VP`, bx + badgeW - 7, byy + badgeH/2);
  });

  // ---- HUD ----
  if (state.round > 0) {
    ctx.fillStyle = 'rgba(139,124,248,0.9)';
    ctx.font = "800 14px 'JetBrains Mono', monospace";
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`ROUND ${state.round}`, 14, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = "600 10px 'JetBrains Mono', monospace";
    ctx.fillText(state.phase.toUpperCase(), 14, 28);
  }
  if (state.productionNumber) {
    ctx.fillStyle = 'rgba(255,190,61,0.9)';
    ctx.font = "800 14px 'JetBrains Mono', monospace";
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText(`\u2699 ${state.productionNumber}`, W - 14, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = "600 9px 'JetBrains Mono', monospace";
    ctx.fillText('PRODUCING', W - 14, 28);
  }

  // ---- Compact Legend (bottom-left) ----
  const lx = 10, lh = 12;
  const legendEntries = [
    { c: TERRAIN.plains.glow, l: 'Grain' }, { c: TERRAIN.forest.glow, l: 'Timber' },
    { c: TERRAIN.mountains.glow, l: 'Ore' }, { c: TERRAIN.rivers.glow, l: 'Energy' },
    { c: TERRAIN.nexus.glow, l: 'Nexus' },
  ];
  const totalLH = legendEntries.length * lh + 8;
  const ly = H - 10 - totalLH;
  ctx.fillStyle = 'rgba(4,4,12,0.75)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(lx, ly, 80, totalLH, 5);
  else ctx.rect(lx, ly, 80, totalLH);
  ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  legendEntries.forEach((e, i) => {
    const ey = ly + 6 + i * lh;
    ctx.fillStyle = e.c; ctx.globalAlpha = 0.7;
    ctx.fillRect(lx + 6, ey, 6, 6);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = "500 8px 'Inter', sans-serif";
    ctx.fillText(e.l, lx + 16, ey + 3);
  });
}

function lightenColor(hex, pct) {
  // Handle rgb/rgba strings too
  let r2, g2, b2;
  if (hex.startsWith('#')) {
    const num = parseInt(hex.replace('#',''), 16);
    r2 = (num >> 16) & 0xFF; g2 = (num >> 8) & 0xFF; b2 = num & 0xFF;
  } else {
    const m = hex.match(/(\d+)/g);
    if (m) { r2 = +m[0]; g2 = +m[1]; b2 = +m[2]; } else { return hex; }
  }
  r2 = Math.max(0, Math.min(255, r2 + pct));
  g2 = Math.max(0, Math.min(255, g2 + pct));
  b2 = Math.max(0, Math.min(255, b2 + pct));
  return `rgb(${r2},${g2},${b2})`;
}

function fallbackHexes() {
  const h = [], r = 2, tt = ['plains','forest','mountains','rivers','wasteland'];
  for (let q=-r;q<=r;q++) for (let rr=-r;rr<=r;rr++) if (Math.abs(q+rr)<=r)
    h.push({q,r:rr,terrain:q===0&&rr===0?'nexus':tt[Math.abs(q*7+rr*13+5)%tt.length],productionNumber:0});
  return h;
}

// POST-GAME REPORT

function showGameOver(data) {
  const container = document.getElementById('report-content');
  const sorted = Object.entries(data.scores||{}).sort((a,b) => b[1] - a[1]);
  const winnerId = data.winner;
  const winner = state.agents[winnerId];
  const h = state.history;

  // Total stats
  const totalTrades = Object.values(h.trades).reduce((a,b) => a+b, 0);
  const totalBetrayals = Object.values(h.betrayals).reduce((a,b) => a+b, 0);
  const totalCrises = h.crises.length;
  const resolvedCrises = h.crises.filter(c => c.resolved).length;

  let html = '';

  // ---- Header ----
  html += `<div class="report-header">
    <h2>GAME OVER</h2>
    <div class="subtitle">${data.rounds} ROUNDS \u2022 ${state.moveCount} MOVES \u2022 ${state.prizePool.toFixed(3)} ETH</div>
  </div>`;

  // ---- Stats Bar ----
  html += `<div class="game-stats-bar">
    <div class="stat-item"><div class="stat-value">${data.rounds}</div><div class="stat-label">Rounds</div></div>
    <div class="stat-item"><div class="stat-value">${state.moveCount}</div><div class="stat-label">Moves</div></div>
    <div class="stat-item"><div class="stat-value" style="color:var(--accent2)">${totalTrades}</div><div class="stat-label">Trades</div></div>
    <div class="stat-item"><div class="stat-value" style="color:var(--danger)">${totalBetrayals}</div><div class="stat-label">Betrayals</div></div>
    <div class="stat-item"><div class="stat-value" style="color:var(--warn)">${state.prizePool.toFixed(3)}</div><div class="stat-label">ETH Pool</div></div>
  </div>`;

  // ---- Podium ----
  html += '<div class="podium">';
  const podiumOrder = sorted.length >= 3 ? [sorted[1], sorted[0], sorted[2]] : sorted;
  const podiumClasses = sorted.length >= 3 ? ['second','first','third'] : sorted.map((_,i) => i===0?'first':'other');
  const podiumLabels = sorted.length >= 3 ? ['2ND','1ST','3RD'] : sorted.map((_,i) => ['1ST','2ND','3RD','4TH'][i]);
  const podiumHeights = sorted.length >= 3 ? [70, 100, 55] : sorted.map((_,i) => [100,70,55,40][i] || 40);

  podiumOrder.forEach(([id, vp], pi) => {
    const a = state.agents[id];
    const cls = podiumClasses[pi];
    const label = podiumLabels[pi];
    const h2 = podiumHeights[pi];
    html += `<div class="podium-slot ${cls}">
      <div class="podium-bar" style="min-height:${h2}px">
        <div class="podium-rank">${label}</div>
        <div class="podium-name" style="color:${a?.color||'#fff'}">${esc(a?.name||id.slice(0,8))}</div>
        <div class="podium-vp">${vp}</div>
        <div class="podium-vp-label">VICTORY POINTS</div>
        ${a?.strategy ? `<div class="podium-strategy">${a.strategy}</div>` : ''}
      </div>
    </div>`;
  });
  // Remaining players
  if (sorted.length > 3) {
    for (let i = 3; i < sorted.length; i++) {
      const [id, vp] = sorted[i];
      const a = state.agents[id];
      html += `<div class="podium-slot">
        <div class="podium-bar" style="min-height:40px">
          <div class="podium-rank">${i+1}TH</div>
          <div class="podium-name" style="color:${a?.color||'#fff'}">${esc(a?.name||id.slice(0,8))}</div>
          <div class="podium-vp" style="font-size:20px">${vp}</div>
          <div class="podium-vp-label">VP</div>
        </div>
      </div>`;
    }
  }
  html += '</div>';

  // ---- VP Timeline Chart ----
  html += `<div class="report-section">
    <div class="report-section-header">Victory Points Over Time</div>
    <div class="report-section-body"><canvas id="vp-chart-canvas"></canvas></div>
  </div>`;

  // ---- Key Moments ----
  if (h.keyMoments.length > 0) {
    html += `<div class="report-section">
      <div class="report-section-header">Key Moments</div>
      <div class="report-section-body">`;
    // Show most significant moments, up to 15
    const moments = h.keyMoments.slice(-20);
    moments.forEach(m => {
      html += `<div class="moment ${m.type}">
        <div class="moment-round">R${m.round}</div>
        <div class="moment-icon">${m.icon}</div>
        <div class="moment-text">
          <div class="moment-title" ${m.agentColor ? `style="color:${m.agentColor}"` : ''}>${esc(m.title)}</div>
          <div class="moment-desc">${esc(m.desc)}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  }

  // ---- Trust Evolution ----
  html += `<div class="report-section">
    <div class="report-section-header">Trust Evolution</div>
    <div class="report-section-body"><canvas id="trust-chart-canvas"></canvas></div>
  </div>`;

  // ---- Final Trust Matrix ----
  html += `<div class="report-section">
    <div class="report-section-header">Final Trust Matrix</div>
    <div class="report-section-body"><div id="report-trust-grid"></div></div>
  </div>`;

  // ---- MVP Awards ----
  html += `<div class="report-section">
    <div class="report-section-header">Awards</div>
    <div class="report-section-body"><div class="awards-grid">`;

  // Most Trusted
  const mostTrusted = state.agentOrder.reduce((best, id) => (!best || (state.agents[id]?.trust||0) > (state.agents[best]?.trust||0)) ? id : best, null);
  const mtAgent = state.agents[mostTrusted];
  html += `<div class="award-card">
    <div class="award-icon">\u{1F91D}</div>
    <div class="award-title">Most Trusted</div>
    <div class="award-winner" style="color:${mtAgent?.color||'#fff'}">${esc(mtAgent?.name||'?')}</div>
    <div class="award-detail">Trust: ${(mtAgent?.trust||0).toFixed(2)}</div>
  </div>`;

  // Best Trader
  const bestTrader = Object.entries(h.trades).sort((a,b)=>b[1]-a[1])[0];
  if (bestTrader) {
    const btAgent = state.agents[bestTrader[0]];
    html += `<div class="award-card">
      <div class="award-icon">\u{1F4B1}</div>
      <div class="award-title">Top Trader</div>
      <div class="award-winner" style="color:${btAgent?.color||'#fff'}">${esc(btAgent?.name||'?')}</div>
      <div class="award-detail">${bestTrader[1]} trades</div>
    </div>`;
  }

  // Master Builder
  const masterBuilder = Object.entries(h.builds).sort((a,b)=>b[1]-a[1])[0];
  if (masterBuilder) {
    const mbAgent = state.agents[masterBuilder[0]];
    html += `<div class="award-card">
      <div class="award-icon">\u{1F3D7}</div>
      <div class="award-title">Master Builder</div>
      <div class="award-winner" style="color:${mbAgent?.color||'#fff'}">${esc(mbAgent?.name||'?')}</div>
      <div class="award-detail">${masterBuilder[1]} builds</div>
    </div>`;
  }

  // Crisis Hero
  const crisisContribs = {};
  h.crises.forEach(c => { (c.contributors||[]).forEach(id => { crisisContribs[id] = (crisisContribs[id]||0) + 1; }); });
  const crisisHero = Object.entries(crisisContribs).sort((a,b)=>b[1]-a[1])[0];
  if (crisisHero) {
    const chAgent = state.agents[crisisHero[0]];
    html += `<div class="award-card">
      <div class="award-icon">\u{1F6E1}</div>
      <div class="award-title">Crisis Hero</div>
      <div class="award-winner" style="color:${chAgent?.color||'#fff'}">${esc(chAgent?.name||'?')}</div>
      <div class="award-detail">${crisisHero[1]} crises resolved</div>
    </div>`;
  }

  // Biggest Villain (most betrayals)
  const biggestVillain = Object.entries(h.betrayals).sort((a,b)=>b[1]-a[1])[0];
  if (biggestVillain && biggestVillain[1] > 0) {
    const bvAgent = state.agents[biggestVillain[0]];
    html += `<div class="award-card">
      <div class="award-icon">\u{1F5E1}</div>
      <div class="award-title">Villain</div>
      <div class="award-winner" style="color:${bvAgent?.color||'#fff'}">${esc(bvAgent?.name||'?')}</div>
      <div class="award-detail">${biggestVillain[1]} betrayals</div>
    </div>`;
  }

  // Longest Road holder
  if (state.bonusHolders.longestRoad) {
    const lrAgent = state.agents[state.bonusHolders.longestRoad];
    html += `<div class="award-card">
      <div class="award-icon">\u{1F6E4}</div>
      <div class="award-title">Longest Road</div>
      <div class="award-winner" style="color:${lrAgent?.color||'#fff'}">${esc(lrAgent?.name||'?')}</div>
      <div class="award-detail">+2 VP bonus</div>
    </div>`;
  }

  html += '</div></div></div>';

  html += '<button class="report-close" id="report-close">CLOSE REPORT</button>';

  container.innerHTML = html;
  document.getElementById('game-over').classList.add('visible');
  document.getElementById('report-close').onclick = () => document.getElementById('game-over').classList.remove('visible');

  // Draw charts after DOM update
  requestAnimationFrame(() => {
    drawVPChart();
    drawTrustChart();
    drawReportTrustGrid();
  });
}

// ---- VP Timeline Chart (canvas) ----
function drawVPChart() {
  const canvas = document.getElementById('vp-chart-canvas');
  if (!canvas) return;
  const W = canvas.parentElement.clientWidth;
  const H = 200;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pad = { t: 20, r: 20, b: 28, l: 36 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

  // Background
  ctx.fillStyle = '#0a0a16';
  ctx.fillRect(0, 0, W, H);

  // Find max VP and max rounds
  let maxVP = 5, maxRounds = 1;
  for (const id of state.agentOrder) {
    const arr = state.history.vpPerRound[id] || [];
    if (arr.length > maxRounds) maxRounds = arr.length;
    arr.forEach(v => { if (v > maxVP) maxVP = v; });
  }
  maxVP = Math.ceil(maxVP * 1.1);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ch * (1 - i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cw, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = "500 8px 'JetBrains Mono', monospace";
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(maxVP * i / 4).toString(), pad.l - 6, y);
  }

  // Round labels
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = "500 8px 'JetBrains Mono', monospace";
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const step = Math.max(1, Math.ceil(maxRounds / 8));
  for (let r = 0; r < maxRounds; r += step) {
    const x = pad.l + (r / (maxRounds - 1 || 1)) * cw;
    ctx.fillText(`R${r + 1}`, x, pad.t + ch + 6);
  }

  // Draw lines
  for (const id of state.agentOrder) {
    const a = state.agents[id];
    const arr = state.history.vpPerRound[id] || [];
    if (arr.length < 2 || !a) continue;

    // Glow
    ctx.save();
    ctx.strokeStyle = a.color;
    ctx.lineWidth = 4;
    ctx.globalAlpha = 0.15;
    ctx.beginPath();
    arr.forEach((vp, ri) => {
      const x = pad.l + (ri / (maxRounds - 1 || 1)) * cw;
      const y = pad.t + ch * (1 - vp / maxVP);
      ri === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.restore();

    // Main line
    ctx.strokeStyle = a.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    arr.forEach((vp, ri) => {
      const x = pad.l + (ri / (maxRounds - 1 || 1)) * cw;
      const y = pad.t + ch * (1 - vp / maxVP);
      ri === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.globalAlpha = 1;

    // End dot + label
    const lastVP = arr[arr.length - 1];
    const lastX = pad.l + ((arr.length - 1) / (maxRounds - 1 || 1)) * cw;
    const lastY = pad.t + ch * (1 - lastVP / maxVP);
    ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
    ctx.fillStyle = a.color; ctx.fill();
    ctx.fillStyle = a.color;
    ctx.font = "700 9px 'JetBrains Mono', monospace";
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const shortName = (a.name || '?').split('_')[0];
    ctx.fillText(`${shortName} ${lastVP}`, lastX + 8, lastY);
  }
}

// ---- Trust Evolution Chart ----
function drawTrustChart() {
  const canvas = document.getElementById('trust-chart-canvas');
  if (!canvas) return;
  const W = canvas.parentElement.clientWidth;
  const H = 180;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pad = { t: 16, r: 20, b: 28, l: 36 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

  ctx.fillStyle = '#0a0a16';
  ctx.fillRect(0, 0, W, H);

  let maxRounds = 1;
  for (const id of state.agentOrder) {
    const arr = state.history.trustPerRound[id] || [];
    if (arr.length > maxRounds) maxRounds = arr.length;
  }

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  const yLabels = ['0.0','0.25','0.5','0.75','1.0'];
  yLabels.forEach((l, i) => {
    const y = pad.t + ch * (1 - i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cw, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = "500 8px 'JetBrains Mono', monospace";
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(l, pad.l - 6, y);
  });

  // Lines
  for (const id of state.agentOrder) {
    const a = state.agents[id];
    const arr = state.history.trustPerRound[id] || [];
    if (arr.length < 2 || !a) continue;

    ctx.strokeStyle = a.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
    ctx.beginPath();
    arr.forEach((t, ri) => {
      const x = pad.l + (ri / (maxRounds - 1 || 1)) * cw;
      const y = pad.t + ch * (1 - Math.min(1, Math.max(0, t)));
      ri === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.globalAlpha = 1;

    const lastT = arr[arr.length - 1];
    const lastX = pad.l + ((arr.length - 1) / (maxRounds - 1 || 1)) * cw;
    const lastY = pad.t + ch * (1 - Math.min(1, Math.max(0, lastT)));
    ctx.beginPath(); ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
    ctx.fillStyle = a.color; ctx.fill();
    ctx.font = "600 8px 'JetBrains Mono', monospace";
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText((a.name||'?').split('_')[0], lastX + 6, lastY);
  }

  // Round labels
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = "500 8px 'JetBrains Mono', monospace";
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const step = Math.max(1, Math.ceil(maxRounds / 8));
  for (let r = 0; r < maxRounds; r += step) {
    const x = pad.l + (r / (maxRounds - 1 || 1)) * cw;
    ctx.fillText(`R${r + 1}`, x, pad.t + ch + 6);
  }
}

// ---- Report Trust Grid ----
function drawReportTrustGrid() {
  const container = document.getElementById('report-trust-grid');
  if (!container) return;
  const { agents: ids, matrix } = state.trustMatrix;
  if (!ids?.length) { container.innerHTML = '<p style="color:var(--text-dim);font-size:11px;">No trust data</p>'; return; }
  const n = ids.length;
  const names = ids.map(id => { const a = state.agents[id]; return a ? a.name.split('_')[0] : id.slice(0,4); });
  const g = document.createElement('div');
  g.className = 'trust-grid';
  g.style.gridTemplateColumns = `60px repeat(${n}, 1fr)`;
  g.style.gridTemplateRows = `24px repeat(${n}, 1fr)`;

  g.innerHTML = '<div></div>';
  names.forEach((nm, i) => {
    const col = state.agents[ids[i]]?.color || '#fff';
    g.innerHTML += `<div class="trust-grid-label" style="color:${col}">${esc(nm)}</div>`;
  });
  for (let i = 0; i < n; i++) {
    const col = state.agents[ids[i]]?.color || '#fff';
    g.innerHTML += `<div class="trust-grid-label" style="color:${col};justify-content:flex-end;padding-right:6px;">${esc(names[i])}</div>`;
    for (let j = 0; j < n; j++) {
      const v = matrix[i]?.[j] || 0;
      const bg = i === j ? 'rgba(20,20,30,0.5)' : trustCol(v);
      g.innerHTML += `<div class="trust-grid-cell" style="background:${bg}">${i === j ? '\u2014' : v.toFixed(2)}</div>`;
    }
  }
  container.innerHTML = '';
  container.appendChild(g);
}

// ============================================================
// Run Button
// ============================================================
document.getElementById('btn-run').onclick = async () => {
  const btn = document.getElementById('btn-run');
  btn.disabled = true; btn.textContent = 'RUNNING...';
  state.agents = {}; state.agentOrder = []; state.round = 0; state.phase = '';
  state.crisis = null; state.prizePool = 0; state.moveCount = 0; state.gameOver = false;
  state.hexGrid = []; state.agentPositions = {}; state.structureOffsets.clear();
  state.bonusHolders = { longestRoad: null, mostInfluence: null };
  state.history = { vpPerRound: {}, trustPerRound: {}, keyMoments: [], trustUpdates: [], crises: [], trades: {}, betrayals: {}, builds: {} };
  document.getElementById('comms-log').innerHTML = '';
  updatePoolDisplay();
  document.getElementById('game-over').classList.remove('visible');
  hideCrisis();
  try {
    const res = await fetch('/api/simulate', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) addSystemMsg('Error: ' + (data.error||'unknown'), 'crisis');
  } catch(err) { addSystemMsg('Failed: ' + err.message, 'crisis'); }
  btn.disabled = false; btn.textContent = 'Run Game';
};

// ============================================================
// Fullscreen Toggle
// ============================================================
function toggleFullscreen() {
  const gv = document.getElementById('game-view');
  gv.classList.toggle('fullscreen');
  document.getElementById('btn-fullscreen').innerHTML = gv.classList.contains('fullscreen') ? '&#x2716;' : '&#x26F6;';
}
document.getElementById('btn-fullscreen').onclick = toggleFullscreen;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const gv = document.getElementById('game-view');
    if (gv.classList.contains('fullscreen')) {
      gv.classList.remove('fullscreen');
      document.getElementById('btn-fullscreen').innerHTML = '&#x26F6;';
    }
  }
});

// ============================================================
// Render Loop
// ============================================================
function tick() { renderHexGrid(); requestAnimationFrame(tick); }
requestAnimationFrame(tick);
renderAgents();
renderTrustHeatmap();
connect();
</script>
